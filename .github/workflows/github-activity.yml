# 每週統計一次 GitHub 上各語言有寫的月份，更新 data/github-activity.json（關於頁的技能等級會用到）
name: Update GitHub activity

on:
  schedule:
    - cron: "0 18 * * 0" # 每週一 02:00（台灣時間）
  workflow_dispatch: # 也可以在 Actions 頁面手動跑

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Count active months
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_activity.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/github-activity.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-activity.json
          git commit -m "Update GitHub activity"
          git push
