<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品 | Partner0487</title>
    <meta name="description" content="實驗室計畫、課程作業和個人專案。">
    <link rel="icon" href="images/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="images/favicon/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png">
    <!-- 分享到 Discord / FB / Threads 時的預覽卡片 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Partner0487">
    <meta property="og:title" content="作品 | Partner0487">
    <meta property="og:description" content="實驗室計畫、課程作業和個人專案。">
    <meta property="og:url" content="https://partner0487.github.io/project.html">
    <meta property="og:image" content="https://partner0487.github.io/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="zh_TW">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="css/project.css" />
    <!-- type="module" 才能在 JS 裡 import Vue；module 預設就會等 HTML 解析完才執行（等同 defer） -->
    <script type="module" src="js/project.js"></script>
  </head>
  <body>
    <nav class="top-nav">
      <a class="home-link" href="./">
        <img src="images/profile/logo.png" alt="" />
        <span>Partner0487</span>
      </a>
      <div class="nav-links">
        <a href="./">首頁</a>
        <a href="about.html">關於</a>
        <a href="project.html" aria-current="page">作品</a>
        <a href="interests.html">興趣</a>
      </div>
    </nav>

    <!--
      Vue 只接管 #app 裡面的內容（在 js/project.js 裡 mount）。
      v-cloak：Vue 還沒載入完之前先把這塊藏起來，避免看到 {{ }} 原始碼，樣式寫在 project.css。
    -->
    <main id="app" class="container" v-cloak>
      <h1>作品</h1>
      <p class="intro">課堂作業、實驗室計畫，還有一些突然想到就做的東西。</p>

      <!-- 篩選按鈕：「全部」加上每個分類各一顆 -->
      <div class="filters" role="group" aria-label="作品分類">
        <button
          v-for="category in ['all', ...categories]"
          :key="category"
          type="button"
          class="filter"
          :class="{ active: current === category }"
          :aria-pressed="current === category"
          @click="current = category"
        >
          {{ category === "all" ? "全部" : category }}
        </button>
      </div>

      <div id="project-list">
        <p v-if="error">作品資料讀取失敗 😢</p>

        <!-- visibleGroups 是 computed：current 一改，這裡就自動只剩選到的分類 -->
        <section
          v-for="group in visibleGroups"
          :key="group.category"
          class="category"
          :data-category="group.category"
        >
          <h2>{{ group.category }}</h2>
          <div class="card-grid">
            <article v-for="project in group.projects" :key="project.name" class="card">
              <div class="card-head">
                <img
                  v-if="project.icon"
                  class="project-icon"
                  :src="project.icon"
                  alt=""
                  :style="{ background: project.iconBg }"
                />
                <h3>{{ project.name }}</h3>
              </div>
              <p>{{ project.desc }}</p>
              <div class="repo-footer">
                <span class="language"><img :src="langIcon(project.lang)" alt="" />{{ langName(project.lang) }}</span>
                <div class="repo-links">
                  <a
                    v-for="link in project.links"
                    :key="link.url"
                    class="repo-btn"
                    :href="link.url"
                    target="_blank"
                    rel="noopener"
                    >{{ link.label }}</a
                  >
                </div>
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-social">
        <a href="https://github.com/partner0487" aria-label="GitHub" target="_blank" rel="noopener"><img src="images/social/github.png" alt=""></a>
        <a href="https://www.facebook.com/plusseven0314/" aria-label="Facebook" target="_blank" rel="noopener"><img src="images/social/facebook.png" alt=""></a>
        <a href="mailto:partner0487@gmail.com" aria-label="Email"><img src="images/social/mail.png" alt=""></a>
        <a href="https://www.instagram.com/plusseven0314/" aria-label="Instagram" target="_blank" rel="noopener"><img src="images/social/instagram.png" alt=""></a>
        <a href="https://discord.com/users/460490770001166346" aria-label="Discord" target="_blank" rel="noopener"><img src="images/social/discord.png" alt=""></a>
        <a href="https://www.threads.net/@plusseven0314" aria-label="Threads" target="_blank" rel="noopener"><img src="images/social/threads.png" alt=""></a>
        <a href="https://www.tiktok.com/@partner0487" aria-label="TikTok" target="_blank" rel="noopener"><img src="images/social/tiktok.png" alt=""></a>
        <a href="https://www.twitch.tv/own_partner" aria-label="Twitch" target="_blank" rel="noopener"><img src="images/social/twitch.png" alt=""></a>
      </div>
      <p>made by Partner</p>
    </footer>
  </body>
</html>
